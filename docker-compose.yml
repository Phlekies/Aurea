services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - audio-data:/data/audio
    environment:
      AUREA_MAX_UPLOAD_BYTES: ${AUREA_MAX_UPLOAD_BYTES:-104857600}
      AUREA_MAX_DURATION_SECONDS: ${AUREA_MAX_DURATION_SECONDS:-1800}
      AUREA_RETENTION_SECONDS: ${AUREA_RETENTION_SECONDS:-86400}
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  audio-data:
